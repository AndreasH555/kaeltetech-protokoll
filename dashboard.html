<body class="bg-slate-100 min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white px-4 py-4 sm:px-6 flex items-center justify-between shadow-md sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-slate-600 flex items-center justify-center font-bold text-lg shrink-0">📁</div>
      <h1 class="text-base sm:text-lg font-semibold">Protokoll-Archiv</h1>
    </div>
    <a href="app.html" class="text-sm text-slate-300 hover:text-white px-3 py-2 rounded-lg hover:bg-slate-800 transition">← Zur App</a>
  </header>

  <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-6 sm:px-6">

    <div id="state-loading" class="text-center text-slate-500 py-12">Lade Protokolle...</div>

    <div id="state-no-auth" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center">
      <p class="text-slate-600 mb-4">Du bist nicht angemeldet.</p>
      <a href="app.html" class="inline-block bg-slate-600 text-white px-5 py-2.5 rounded-xl font-medium">Zur Anmeldung</a>
    </div>

    <div id="state-no-company" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center">
      <p class="text-slate-600 mb-4">Dir ist noch keine Firma zugeordnet.</p>
      <a href="app.html" class="inline-block bg-slate-600 text-white px-5 py-2.5 rounded-xl font-medium">Zurück zur App</a>
    </div>

    <div id="state-content" class="hidden">

      <!-- Such-/Filterleiste -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4 flex flex-col sm:flex-row gap-3">
        <input type="text" id="search-input" placeholder="Suche nach Kundenname oder Adresse..." oninput="applyFilters()"
          class="flex-1 border-slate-200 border rounded-xl p-3 text-sm bg-slate-50/50">
        <select id="type-filter" onchange="applyFilters()" class="border-slate-200 border rounded-xl p-3 text-sm bg-slate-50/50">
          <option value="">Alle Typen</option>
          <option value="inbetriebnahme">Inbetriebnahme</option>
          <option value="dichtigkeit">Dichtigkeitsprüfung</option>
        </select>
        <input type="date" id="date-filter" oninput="applyFilters()"
          class="border-slate-200 border rounded-xl p-3 text-sm bg-slate-50/50">
        <button onclick="clearFilters()" class="text-sm text-slate-500 hover:text-slate-700 px-3 py-2 whitespace-nowrap">
          Filter zurücksetzen
        </button>
      </div>

      <p id="result-count" class="text-xs text-slate-400 mb-2 px-1"></p>

      <!-- Tabelle (Desktop) -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto hidden sm:block">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-slate-200 text-left text-xs text-slate-500 uppercase">
              <th class="p-3">Datum</th>
              <th class="p-3">Nr.</th>
              <th class="p-3">Typ</th>
              <th class="p-3">Kunde</th>
              <th class="p-3">Adresse</th>
              <th class="p-3">Techniker</th>
              <th class="p-3">Details</th>
              <th class="p-3"></th>
            </tr>
          </thead>
          <tbody id="protocol-table-body"></tbody>
        </table>
      </div>

      <!-- Karten-Liste (Mobil) -->
      <div id="protocol-card-list" class="sm:hidden space-y-3"></div>

      <p id="empty-state" class="hidden text-center text-slate-400 py-12">Keine Einträge gefunden.</p>
    </div>

  </main>

<script>
  // TODO: identische Werte wie in index.html eintragen
  const SUPABASE_URL = 'https://hirqybbwgjtwdlqzdmsr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_KlrmVMrzvmosZXDXbgs7Kg_sP5iwfGX';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allItems = [];
  let companyInfo = null;

  function showState(stateId) {
    ['state-loading', 'state-no-auth', 'state-no-company', 'state-content']
      .forEach(id => document.getElementById(id).classList.toggle('hidden', id !== stateId));
  }

  async function init() {
    showState('state-loading');
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { showState('state-no-auth'); return; }

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('id, company_id, companies(company_name, address, logo_url)')
      .eq('id', session.user.id)
      .single();

    if (profileError || !profile) { showState('state-no-auth'); return; }
    if (!profile.company_id) { showState('state-no-company'); return; }

    companyInfo = profile.companies;

    const [protocolsRes, leakChecksRes] = await Promise.all([
      supabaseClient.from('protocols').select('*, technician:profiles(full_name)').order('created_at', { ascending: false }),
      supabaseClient.from('leak_checks').select('*, technician:profiles(full_name)').order('created_at', { ascending: false }),
    ]);

    const protocols = protocolsRes.error ? [] : (protocolsRes.data || []);
    if (protocolsRes.error) console.error('Protokolle konnten nicht geladen werden:', protocolsRes.error.message);
    const leakChecks = leakChecksRes.error ? [] : (leakChecksRes.data || []);
    if (leakChecksRes.error) console.error('Dichtigkeitsprüfungen konnten nicht geladen werden:', leakChecksRes.error.message);

    const protocolItems = protocols.map(p => ({
      id: p.id,
      type: 'inbetriebnahme',
      typeLabel: 'Inbetriebnahme',
      number: p.protocol_number ? ('KP-' + p.protocol_year + '-' + String(p.protocol_number).padStart(4, '0')) : '—',
      customer_name: p.customer_name,
      installation_address: p.installation_address,
      technician_name: (p.technician && p.technician.full_name) || '—',
      detail: p.unit_type || '—',
      created_at: p.created_at,
      raw: p,
    }));
    const leakItems = leakChecks.map(l => ({
      id: l.id,
      type: 'dichtigkeit',
      typeLabel: 'Dichtigkeitsprüfung',
      number: l.protocol_number ? ('DP-' + l.protocol_year + '-' + String(l.protocol_number).padStart(4, '0')) : '—',
      customer_name: l.customer_name,
      installation_address: l.installation_address,
      technician_name: (l.technician && l.technician.full_name) || '—',
      detail: l.system_identifier || l.refrigerant || '—',
      created_at: l.created_at,
      raw: l,
    }));

    allItems = [...protocolItems, ...leakItems].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    showState('state-content');
    applyFilters();
  }
  init();

  function clearFilters() {
    document.getElementById('search-input').value = '';
    document.getElementById('date-filter').value = '';
    document.getElementById('type-filter').value = '';
    applyFilters();
  }

  function applyFilters() {
    const search = document.getElementById('search-input').value.trim().toLowerCase();
    const dateFilter = document.getElementById('date-filter').value; // yyyy-mm-dd
    const typeFilter = document.getElementById('type-filter').value;

    const filtered = allItems.filter(item => {
      const matchesSearch = !search ||
        (item.customer_name || '').toLowerCase().includes(search) ||
        (item.installation_address || '').toLowerCase().includes(search) ||
        (item.number || '').toLowerCase().includes(search);
      const matchesDate = !dateFilter || (item.created_at || '').slice(0, 10) === dateFilter;
      const matchesType = !typeFilter || item.type === typeFilter;
      return matchesSearch && matchesDate && matchesType;
    });

    renderProtocols(filtered);
  }

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('de-DE');
  }

  // Verhindert XSS: Nutzereingaben (Kundenname, Adresse etc.) werden roh
  // per innerHTML gerendert — ohne Escaping könnte z.B. ein Kundenname
  // wie ein SKRIPT-Tag im Dashboard ausgeführt werden.
  function escapeHtml(value) {
    if (value == null) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function renderProtocols(list) {
    const tbody = document.getElementById('protocol-table-body');
    const cardList = document.getElementById('protocol-card-list');
    const emptyState = document.getElementById('empty-state');
    const resultCount = document.getElementById('result-count');

    resultCount.textContent = `${list.length} Eintrag${list.length === 1 ? '' : 'e'}`;
    emptyState.classList.toggle('hidden', list.length > 0);

    function badge(item) {
      const isLeak = item.type === 'dichtigkeit';
      const cls = isLeak ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-700';
      return `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium ${cls}">${item.typeLabel}</span>`;
    }
    function downloadHandler(item) {
      return item.type === 'dichtigkeit' ? `downloadLeakCheckPdf('${item.id}')` : `downloadProtocolPdf('${item.id}')`;
    }

    tbody.innerHTML = list.map(item => `
      <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
        <td class="p-3 whitespace-nowrap text-slate-500">${formatDate(item.created_at)}</td>
        <td class="p-3 font-mono text-xs text-slate-500 whitespace-nowrap">${escapeHtml(item.number)}</td>
        <td class="p-3">${badge(item)}</td>
        <td class="p-3 font-medium text-slate-800">${escapeHtml(item.customer_name) || '—'}</td>
        <td class="p-3 text-slate-500">${escapeHtml(item.installation_address) || '—'}</td>
        <td class="p-3 text-slate-500">${escapeHtml(item.technician_name)}</td>
        <td class="p-3 text-slate-500">${escapeHtml(item.detail)}</td>
        <td class="p-3 text-right">
          <button data-item-id="${item.id}" onclick="${downloadHandler(item)}" class="text-slate-600 hover:underline text-xs font-medium whitespace-nowrap">
            📄 PDF herunterladen
          </button>
        </td>
      </tr>
    `).join('');

    cardList.innerHTML = list.map(item => `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
        <div class="flex justify-between items-start mb-2">
          <div>
            <div class="flex items-center gap-2 mb-1">${badge(item)} <span class="font-mono text-xs text-slate-400">${escapeHtml(item.number)}</span></div>
            <div class="font-semibold text-slate-800">${escapeHtml(item.customer_name) || '—'}</div>
            <div class="text-xs text-slate-500">${escapeHtml(item.installation_address) || '—'}</div>
          </div>
          <div class="text-xs text-slate-400 whitespace-nowrap">${formatDate(item.created_at)}</div>
        </div>
        <div class="text-xs text-slate-500 mb-3">
          ${escapeHtml(item.technician_name)} · ${escapeHtml(item.detail)}
        </div>
        <button data-item-id="${item.id}" onclick="${downloadHandler(item)}" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium py-2 rounded-lg">
          📄 PDF herunterladen
        </button>
      </div>
    `).join('');
  }

  // ===================== PDF-Re-Export aus gespeicherten Daten =====================
  async function urlToDataUrl(url) {
    try {
      const response = await fetch(url, { mode: 'cors' });
      const blob = await response.blob();
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    } catch (e) {
      console.error('Bild konnte nicht geladen werden:', url, e);
      return null;
    }
  }

  function detectImageFormat(dataUrl) {
    if (!dataUrl) return 'PNG';
    if (dataUrl.startsWith('data:image/jpeg') || dataUrl.startsWith('data:image/jpg')) return 'JPEG';
    return 'PNG';
  }

  function pdfSafe(str) {
    return String(str)
      .replace(/₂/g, '2')
      .replace(/≥/g, '>=')
      .replace(/≤/g, '<=')
      .replace(/—/g, '-');
  }

  const GWP_TABLE = { 'R32': 675, 'R290 Propan': 3, 'R410A': 2088 };

  // Fotos liegen in einem privaten Bucket -> signierte URL erzeugen, bevor
  // sie als Data-URL für jsPDF geladen werden können.
  async function loadProtocolPhoto(path) {
    if (!path) return null;
    const { data, error } = await supabaseClient.storage.from('protocol-photos').createSignedUrl(path, 60);
    if (error || !data) {
      console.error('Signierte URL fehlgeschlagen:', path, error && error.message);
      return null;
    }
    return await urlToDataUrl(data.signedUrl);
  }

  async function downloadProtocolPdf(protocolId) {
    const item = allItems.find(i => i.id === protocolId && i.type === 'inbetriebnahme');
    if (!item) return;
    const record = item.raw;

    const btns = document.querySelectorAll(`[data-item-id="${protocolId}"]`);
    const originalLabels = [];
    btns.forEach(b => { originalLabels.push(b.innerHTML); b.disabled = true; b.innerHTML = '⏳ Lädt...'; });

    try {
      const [photo1DataUrl, photo2DataUrl, logoDataUrl] = await Promise.all([
        loadProtocolPhoto(record.photo_1_url),
        loadProtocolPhoto(record.photo_2_url),
        (companyInfo && companyInfo.logo_url) ? urlToDataUrl(companyInfo.logo_url) : Promise.resolve(null),
      ]);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

      const marginX = 10;
      const marginTop = 12;
      const pageWidth = 210;
      const contentWidth = pageWidth - marginX * 2;
      let y = marginTop;

      const companyName = (companyInfo && companyInfo.company_name) || 'Inbetriebnahmeprotokoll';
      const companyAddress = (companyInfo && companyInfo.address) || 'Nach F-Gase-Verordnung';
      const textX = marginX + (logoDataUrl ? 20 : 0);

      if (logoDataUrl) {
        try { doc.addImage(logoDataUrl, detectImageFormat(logoDataUrl), marginX, y, 16, 16); } catch (e) { console.error('Logo-Fehler:', e); }
      }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(15);
      doc.setTextColor(15, 23, 42);
      doc.text(pdfSafe(companyName), textX, y + 6);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(100, 116, 139);
      doc.text(pdfSafe(companyAddress), textX, y + 11);

      const shortId = record.protocol_number
        ? 'KP-' + record.protocol_year + '-' + String(record.protocol_number).padStart(4, '0')
        : 'KP-' + new Date(record.created_at).getFullYear() + '-' + record.id.slice(0, 4).toUpperCase(); // Fallback für ältere Protokolle ohne fortlaufende Nummer
      doc.setFontSize(9);
      doc.text(shortId, pageWidth - marginX, y + 4, { align: 'right' });
      doc.text(formatDate(record.created_at), pageWidth - marginX, y + 9, { align: 'right' });

      y += 20;
      doc.setDrawColor(15, 23, 42);
      doc.setLineWidth(0.6);
      doc.line(marginX, y, pageWidth - marginX, y);
      y += 8;

      function sectionHeading(title) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(30, 41, 59);
        doc.text(title, marginX, y);
        doc.setDrawColor(203, 213, 225);
        doc.setLineWidth(0.2);
        doc.line(marginX, y + 1.5, pageWidth - marginX, y + 1.5);
        y += 7;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9.5);
        doc.setTextColor(30, 41, 59);
      }
      function fieldLine(label, value, xOffset) {
        doc.setFont('helvetica', 'bold');
        doc.text(pdfSafe(label), marginX + xOffset, y);
        const labelWidth = doc.getTextWidth(label + ' ');
        doc.setFont('helvetica', 'normal');
        doc.text(pdfSafe(value == null || value === '' ? '—' : value), marginX + xOffset + labelWidth, y);
      }

      const halfWidth = contentWidth / 2;
      const thirdWidth = contentWidth / 3;

      sectionHeading('1. Auftraggeber & Betriebszertifizierung');
      fieldLine('Kunde:', record.customer_name, 0);
      fieldLine('Adresse:', record.installation_address, halfWidth);
      y += 6;
      fieldLine('Techniker:', (record.technician && record.technician.full_name) || '—', 0);
      y += 10;

      sectionHeading('2. Anlageneigenschaften & Kältemittel');
      const factoryCharge = parseFloat(record.factory_charge) || 0;
      const extraGrams = parseFloat(record.extra_charge_g) || 0;
      const totalKg = factoryCharge + extraGrams / 1000;
      const gwp = GWP_TABLE[record.refrigerant] || 0;
      const co2eTonnes = (totalKg * gwp) / 1000;
      let interval = 'Kein regelmäßiges Prüfintervall erforderlich (< 5 t CO2e)';
      if (co2eTonnes >= 500) interval = 'Prüfintervall: alle 3 Monate (>= 500 t CO2e)';
      else if (co2eTonnes >= 50) interval = 'Prüfintervall: alle 6 Monate (>= 50 t CO2e)';
      else if (co2eTonnes >= 5) interval = 'Prüfintervall: jährlich (>= 5 t CO2e)';

      fieldLine('Anlagentyp:', record.unit_type, 0);
      fieldLine('Kältemittel:', record.refrigerant, thirdWidth);
      fieldLine('Werksfüllung:', factoryCharge.toFixed(2) + ' kg', thirdWidth * 2);
      y += 6;
      fieldLine('Leitungslänge:', (record.pipe_length != null ? record.pipe_length : '—') + ' m', 0);
      fieldLine('Zusatzfüllung:', extraGrams + ' g', thirdWidth);
      fieldLine('Gesamt:', totalKg.toFixed(2) + ' kg', thirdWidth * 2);
      y += 6;
      fieldLine('CO2-Aequivalent:', co2eTonnes.toFixed(2) + ' t CO2e', 0);
      y += 5;
      doc.setFontSize(8.5);
      doc.setTextColor(100, 116, 139);
      const intervalLines = doc.splitTextToSize(pdfSafe(interval), contentWidth);
      doc.text(intervalLines, marginX, y);
      y += intervalLines.length * 4 + 6;
      doc.setTextColor(30, 41, 59);

      sectionHeading('3. Druck-, Vakuum- & Dichtigkeitsprüfung');
      fieldLine('Stickstoff-Prüfdruck:', (record.pressure_bar != null ? record.pressure_bar : '—') + ' bar', 0);
      fieldLine('Vakuum-Endwert:', (record.vacuum_mbar != null ? record.vacuum_mbar : '—') + ' mbar', halfWidth);
      y += 6;
      fieldLine((record.pressure_passed ? '[x]' : '[ ]') + ' Druckprüfung 30 Min.:', record.pressure_passed ? 'bestanden' : 'nicht bestanden', 0);
      fieldLine((record.leak_passed ? '[x]' : '[ ]') + ' Elektr. Lecksuche:', record.leak_passed ? 'bestanden' : 'nicht bestanden', halfWidth);
      y += 10;

      sectionHeading('4. Baustellen-Fotodokumentation');
      const photoBoxW = (contentWidth - 6) / 2;
      const photoBoxH = 45;
      function drawPhoto(dataUrl, x) {
        if (!dataUrl) {
          doc.setFontSize(8.5);
          doc.setTextColor(148, 163, 184);
          doc.text('Kein Foto', x, y + 6);
          return;
        }
        try { doc.addImage(dataUrl, detectImageFormat(dataUrl), x, y, photoBoxW, photoBoxH, undefined, 'FAST'); }
        catch (e) { console.error('Foto-Fehler:', e); }
      }
      drawPhoto(photo1DataUrl, marginX);
      drawPhoto(photo2DataUrl, marginX + photoBoxW + 6);
      y += photoBoxH + 10;

      const pageHeight = 297;
      const bottomMargin = 15;
      if (y + 40 > pageHeight - bottomMargin) {
        doc.addPage();
        y = marginTop;
      }

      sectionHeading('5. Abnahme & Unterschriften');
      const sigWidthMm = (contentWidth - 6) / 2;
      const sigHeightMm = 22;

      if (record.signature_png_base64) {
        doc.addImage(record.signature_png_base64, 'PNG', marginX, y, sigWidthMm, sigHeightMm);
      }
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.3);
      doc.line(marginX, y + sigHeightMm + 1, marginX + sigWidthMm, y + sigHeightMm + 1);
      doc.setFontSize(8);
      doc.setTextColor(148, 163, 184);
      doc.text('Kunde / Betreiber', marginX, y + sigHeightMm + 5);

      const techX = marginX + sigWidthMm + 6;
      if (record.signature_technician_png_base64) {
        doc.addImage(record.signature_technician_png_base64, 'PNG', techX, y, sigWidthMm, sigHeightMm);
      }
      doc.line(techX, y + sigHeightMm + 1, techX + sigWidthMm, y + sigHeightMm + 1);
      doc.text('Techniker', techX, y + sigHeightMm + 5);

      doc.save(`Inbetriebnahme_${record.customer_name || 'Protokoll'}.pdf`);
    } finally {
      btns.forEach((b, i) => { b.disabled = false; b.innerHTML = originalLabels[i]; });
    }
  }

  async function downloadLeakCheckPdf(leakCheckId) {
    const item = allItems.find(i => i.id === leakCheckId && i.type === 'dichtigkeit');
    if (!item) return;
    const record = item.raw;

    const btns = document.querySelectorAll(`[data-item-id="${leakCheckId}"]`);
    const originalLabels = [];
    btns.forEach(b => { originalLabels.push(b.innerHTML); b.disabled = true; b.innerHTML = '⏳ Lädt...'; });

    try {
      const [photoDataUrl, logoDataUrl] = await Promise.all([
        loadProtocolPhoto(record.photo_url),
        (companyInfo && companyInfo.logo_url) ? urlToDataUrl(companyInfo.logo_url) : Promise.resolve(null),
      ]);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

      const marginX = 10;
      const marginTop = 12;
      const pageWidth = 210;
      const contentWidth = pageWidth - marginX * 2;
      let y = marginTop;

      const companyName = (companyInfo && companyInfo.company_name) || 'Dichtigkeitsprüfung';
      const companyAddress = (companyInfo && companyInfo.address) || 'Nach F-Gase-Verordnung';
      const textX = marginX + (logoDataUrl ? 20 : 0);

      if (logoDataUrl) {
        try { doc.addImage(logoDataUrl, detectImageFormat(logoDataUrl), marginX, y, 16, 16); } catch (e) { console.error('Logo-Fehler:', e); }
      }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(15);
      doc.setTextColor(15, 23, 42);
      doc.text(pdfSafe(companyName), textX, y + 6);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(100, 116, 139);
      doc.text(pdfSafe(companyAddress), textX, y + 11);

      const shortId = record.protocol_number
        ? 'DP-' + record.protocol_year + '-' + String(record.protocol_number).padStart(4, '0')
        : 'DP-' + new Date(record.created_at).getFullYear() + '-' + record.id.slice(0, 4).toUpperCase(); // Fallback für ältere Einträge ohne fortlaufende Nummer
      doc.setFontSize(9);
      doc.text(shortId, pageWidth - marginX, y + 4, { align: 'right' });
      doc.text(formatDate(record.created_at), pageWidth - marginX, y + 9, { align: 'right' });

      y += 20;
      doc.setDrawColor(15, 23, 42);
      doc.setLineWidth(0.6);
      doc.line(marginX, y, pageWidth - marginX, y);
      y += 8;

      function sectionHeading(title) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(180, 83, 9);
        doc.text(title, marginX, y);
        doc.setDrawColor(203, 213, 225);
        doc.setLineWidth(0.2);
        doc.line(marginX, y + 1.5, pageWidth - marginX, y + 1.5);
        y += 7;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9.5);
        doc.setTextColor(30, 41, 59);
      }
      function fieldLine(label, value, xOffset) {
        doc.setFont('helvetica', 'bold');
        doc.text(pdfSafe(label), marginX + xOffset, y);
        const labelWidth = doc.getTextWidth(label + ' ');
        doc.setFont('helvetica', 'normal');
        doc.text(pdfSafe(value == null || value === '' ? '—' : value), marginX + xOffset + labelWidth, y);
      }

      const halfWidth = contentWidth / 2;

      sectionHeading('1. Kunde & Anlagenkennzeichnung');
      fieldLine('Kunde:', record.customer_name, 0);
      fieldLine('Adresse:', record.installation_address, halfWidth);
      y += 6;
      fieldLine('Techniker:', (record.technician && record.technician.full_name) || '—', 0);
      fieldLine('Anlage:', record.system_identifier, halfWidth);
      y += 10;

      sectionHeading('2. Kältemittel & Füllmenge');
      const chargeKg = parseFloat(record.charge_kg) || 0;
      const gwp = GWP_TABLE[record.refrigerant] || 0;
      const co2eTonnes = (chargeKg * gwp) / 1000;
      let interval = 'Kein regelmäßiges Prüfintervall erforderlich (< 5 t CO2e)';
      if (co2eTonnes >= 500) interval = 'Prüfintervall: alle 3 Monate (>= 500 t CO2e)';
      else if (co2eTonnes >= 50) interval = 'Prüfintervall: alle 6 Monate (>= 50 t CO2e)';
      else if (co2eTonnes >= 5) interval = 'Prüfintervall: jährlich (>= 5 t CO2e)';

      fieldLine('Kältemittel:', record.refrigerant, 0);
      fieldLine('Füllmenge:', chargeKg.toFixed(2) + ' kg', halfWidth);
      y += 6;
      fieldLine('CO2-Aequivalent:', co2eTonnes.toFixed(2) + ' t CO2e', 0);
      y += 5;
      doc.setFontSize(8.5);
      doc.setTextColor(100, 116, 139);
      const nextDueText = record.next_check_due ? ('Fällig: ' + new Date(record.next_check_due).toLocaleDateString('de-DE')) : '';
      const intervalLines = doc.splitTextToSize(pdfSafe(interval + ' ' + nextDueText), contentWidth);
      doc.text(intervalLines, marginX, y);
      y += intervalLines.length * 4 + 6;
      doc.setTextColor(30, 41, 59);

      sectionHeading('3. Prüfmethode & Ergebnis');
      fieldLine('Prüfmethode:', record.check_method, 0);
      fieldLine('Leckage festgestellt:', record.leak_detected ? 'Ja' : 'Nein', halfWidth);
      y += 6;
      if (record.leak_detected && record.leak_description) {
        const descLines = doc.splitTextToSize(pdfSafe('Beschreibung: ' + record.leak_description), contentWidth);
        doc.text(descLines, marginX, y);
        y += descLines.length * 4.5 + 4;
      }
      y += 4;

      sectionHeading('4. Fotodokumentation');
      const photoBoxW = 80;
      const photoBoxH = 45;
      if (photoDataUrl) {
        try { doc.addImage(photoDataUrl, detectImageFormat(photoDataUrl), marginX, y, photoBoxW, photoBoxH, undefined, 'FAST'); }
        catch (e) { console.error('Foto-Fehler:', e); }
      } else {
        doc.setFontSize(8.5);
        doc.setTextColor(148, 163, 184);
        doc.text('Kein Foto', marginX, y + 6);
      }
      y += photoBoxH + 10;

      const pageHeight = 297;
      const bottomMargin = 15;
      if (y + 40 > pageHeight - bottomMargin) {
        doc.addPage();
        y = marginTop;
      }

      sectionHeading('5. Abnahme & Unterschriften');
      const sigWidthMm = (contentWidth - 6) / 2;
      const sigHeightMm = 22;

      if (record.signature_customer_png_base64) {
        doc.addImage(record.signature_customer_png_base64, 'PNG', marginX, y, sigWidthMm, sigHeightMm);
      }
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.3);
      doc.line(marginX, y + sigHeightMm + 1, marginX + sigWidthMm, y + sigHeightMm + 1);
      doc.setFontSize(8);
      doc.setTextColor(148, 163, 184);
      doc.text('Kunde / Betreiber', marginX, y + sigHeightMm + 5);

      const techX = marginX + sigWidthMm + 6;
      if (record.signature_technician_png_base64) {
        doc.addImage(record.signature_technician_png_base64, 'PNG', techX, y, sigWidthMm, sigHeightMm);
      }
      doc.line(techX, y + sigHeightMm + 1, techX + sigWidthMm, y + sigHeightMm + 1);
      doc.text('Techniker', techX, y + sigHeightMm + 5);

      doc.save(`Dichtigkeitspruefung_${record.customer_name || 'Protokoll'}.pdf`);
    } finally {
      btns.forEach((b, i) => { b.disabled = false; b.innerHTML = originalLabels[i]; });
    }
  }
</script>
